[package]
name = "pinewasm_lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "PineWASM language server for Pine Script® source files"

[[bin]]
name = "pinewasm"
path = "src/main.rs"
required-features = ["server"]

# `server` (default) carries the LSP transport. With
# `default-features = false` only the transport-free analysis layer builds,
# which is what pinewasm_bindings links for the in-browser Outline symbols.
[features]
default = ["server"]
server = ["dep:lsp-server", "dep:lsp-types", "dep:url", "dep:pinewasm_migrate"]

[dependencies]
pinewasm_compiler = { workspace = true }
pinewasm_hir = { workspace = true }
pinewasm_migrate = { workspace = true, optional = true }
pinewasm_parse = { workspace = true }
pinewasm_semantics = { workspace = true }
pinewasm_span = { workspace = true }
pinewasm_syntax = { workspace = true }
lsp-server = { workspace = true, optional = true }
lsp-types = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
