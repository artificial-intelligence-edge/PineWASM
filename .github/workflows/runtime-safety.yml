        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: "false"
          # The toolchain installer owns Cargo executables; never restore over them.
          cache-bin: "false"
          cache-workspace-crates: "true"
          shared-key: runtime-safety-address-${{ hashFiles('rust-toolchain.toml', '.github/runtime-safety-toolchain.toml') }}

      - name: Discard an incomplete Rust cache restore
        if: steps.rust_cache.outcome == 'failure'
        run: cargo clean

      - name: Run native runtime paths under AddressSanitizer
        env:
          CARGO_HTTP_TIMEOUT: "120"
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
        run: cargo run --locked -p pinewasm_xtask -- runtime-safety-asan
