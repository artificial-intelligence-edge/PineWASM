          python_path="$(type -P python3)"
          [[ "$python_path" == /* && -x "$python_path" ]]
          "$python_path" --version
          "$python_path" -I - <<'PYPREFLIGHT'
          import json, pathlib, sys
          if sys.version_info < (3, 11):
              raise SystemExit("Python 3.11+ is required for the selected CI checks; no fallback")
          import tomllib
          print(json.dumps({"pythonExecutable": str(pathlib.Path(sys.executable).resolve(strict=True)), "pythonVersion": sys.version.split()[0], "tomllibAvailable": True}, sort_keys=True))
          PYPREFLIGHT
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: "1000"
          GIT_HTTP_LOW_SPEED_TIME: "60"
        with:
          persist-credentials: false
          clean: ${{ runner.os == 'Windows' }}

      - name: Report native workspace disk
        run: df -h .

      - name: Prepare an exclusive native cache workspace
        id: native_workspace
        if: runner.os != 'Windows'
        run: python3 -B .github/ci/native_cache.py prepare

      # Bootstrap native runners through the official installer when an image
      # ships without rustup, without adding an action outside the repository's
      # permitted set.
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rust_cargo_bin="${CARGO_HOME:-${HOME}/.cargo}/bin"
          export PATH="${rust_cargo_bin}:${PATH}"
          if ! command -v rustup >/dev/null 2>&1; then
