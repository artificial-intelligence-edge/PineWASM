            sh "${rustup_installer}" -y --no-modify-path --profile minimal --default-toolchain none
          fi
          printf '%s\n' "${rust_cargo_bin}" >> "${GITHUB_PATH}"
          rustup toolchain install "${PINEWASM_RUST_VERSION}" --profile minimal --component rustfmt --component clippy
          rustup default "${PINEWASM_RUST_VERSION}"

      # Cargo still checks locked registry inputs on each run. Native build
      # outputs use the bounded cache below; post-job cache maintenance is not used.
      - name: Record actual stable parent and Cargo child tools
        id: toolchain_stable
        run: |
          tool_pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          python3 .github/ci/toolchain_identity.py --toolchain "$tool_pin" \
            --record "$RUNNER_TEMP/tools-stable.json" --github-path "$GITHUB_PATH" \
            --github-output "$GITHUB_OUTPUT"
      - name: Record exact stable tool identity
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_HEAD_SHA: ${{ github.sha }}
          EXPECTED_TOOL_RECORD_SHA: ${{ steps.toolchain_stable.outputs.record_sha256 }}
        run: python3 .github/ci/emit_owned_record.py --kind toolchain --path "$RUNNER_TEMP/tools-stable.json" --expected-sha "$EXPECTED_TOOL_RECORD_SHA"
      - name: Cache Windows registry downloads
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: "false"
          # The toolchain installer owns rustup and Cargo executables.
          cache-bin: "false"
          cache-targets: "false"

      - name: Restore native build outputs by source revision
        if: runner.os != 'Windows' && steps.native_workspace.outputs.warm != 'true'
        id: native_cache
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.d
            target/debug/deps/*.so
            target/debug/deps/*.dylib
            target/debug/deps/*.dll
            target/debug/deps/pinewasm_xtask-*
            target/debug/pinewasm_xtask*
          key: native-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            native-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-

      - name: Discard an incomplete native cache restore
        if: steps.native_cache.outcome == 'failure'
        run: |
          python3 -B .github/ci/native_cache.py recover
          cargo clean

      - name: Preserve prepared native inputs for incremental retries
        if: runner.os != 'Windows'
        run: python3 -B .github/ci/native_cache.py checkpoint

      - name: Verify cached builds do not hide source changes or compile errors
        if: runner.os != 'Windows' && needs.plan.outputs.full == 'true'
        env:
          NATIVE_CACHE_CARGO_CHECK: '1'
        run: python3 -B -m unittest discover -s .github/ci -p 'test_native_cache.py'

      - name: Require selected checks on this GitHub-hosted runner
        id: reuse
        env:
          CI_DISABLE_REUSE: "true"
        run: cargo run --locked -p pinewasm_xtask -- ci-reuse --lane "rust-${{ matrix.platform }}" --github-output "$GITHUB_OUTPUT"

      - name: Install Wasm target for binding lint
        if: steps.reuse.outputs.reused != 'true' && (matrix.platform == 'linux-x64')
        run: rustup target add wasm32-unknown-unknown

      - name: Check formatting
        if: steps.reuse.outputs.reused != 'true' && (matrix.platform == 'linux-x64')
        run: cargo fmt --all --check

      - name: Lint with zero warnings
        if: steps.reuse.outputs.reused != 'true' && (matrix.platform == 'linux-x64')
        run: |
          cargo run --locked -p pinewasm_xtask -- ci-run --stage lint

      - name: Check Rust documentation, facade re-exports, and examples
        if: steps.reuse.outputs.reused != 'true' && (matrix.platform == 'linux-x64' && needs.plan.outputs.docs == 'true')
        run: cargo run --locked -p pinewasm_xtask -- docs-check

      - name: Check supported feature configurations
        if: steps.reuse.outputs.reused != 'true' && (matrix.platform == 'linux-x64')
        run: cargo run --locked -p pinewasm_xtask -- ci-run --stage feature-check

      - name: Test Rust workspace and embedding example
        if: steps.reuse.outputs.reused != 'true'
        env:
          # Every compilation in the test suite also runs the in-process
          # translation validator on the CSIL optimization passes
          # (CompileOptions::validate_passes, off by default elsewhere).
          PINEWASM_VALIDATE_PASSES: "1"
        run: |
          cargo run --locked -p pinewasm_xtask -- ci-run --stage default

      # The chart runtime is built from this tree rather than checked in, and
      # the suite that runs linked chart modules exists only in a compiler built
      # with it.
      - name: Test linked chart modules against the chart runtime
        if: steps.reuse.outputs.reused != 'true' && (matrix.platform == 'linux-x64')
        run: cargo run --locked -p pinewasm_xtask -- chart-test

      - name: Test artifact-to-VM bridge
        if: steps.reuse.outputs.reused != 'true' && (matrix.platform == 'linux-x64' && needs.plan.outputs.full == 'true')
        run: cargo test --locked -p pinewasm_compiler --test artifact_import_bridge

      - name: Release completed native build outputs before the all-feature build
        if: steps.reuse.outputs.reused != 'true' && (matrix.platform == 'linux-x64')
        run: cargo clean

      - name: Test all-feature and minimal-feature configurations
        if: steps.reuse.outputs.reused != 'true' && (matrix.platform == 'linux-x64')
        run: |
          cargo run --locked -p pinewasm_xtask -- ci-run --stage all-features
          cargo run --locked -p pinewasm_xtask -- ci-run --stage minimal

      # The benchmark correctness gate, and only the correctness gate. It
      # builds an unoptimized subject and reports no timing, because a shared
      # runner may not produce timing that meets the run protocol in
      # docs/benchmarks.md. What it does catch is a workload, projection, or
      # engine change that silently moves a measured series away from the
      # expected outputs stored with each workload that the suite checks against.
      - name: Run the benchmark correctness gate
        if: steps.reuse.outputs.reused != 'true' && (matrix.platform == 'linux-x64' && needs.plan.outputs.adversarial == 'true')
        run: cargo run --locked -p pinewasm_xtask -- benchmark-subject smoke

      - name: Record validation inputs
        if: steps.reuse.outputs.reused != 'true'
        id: receipt
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          cargo run --locked -p pinewasm_xtask -- ci-record --lane "rust-${{ matrix.platform }}" --output "$RUNNER_TEMP/receipt.json" --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/ci-record-stdout.txt"
          python3 .github/ci/emit_owned_record.py --kind ci-record --path "$RUNNER_TEMP/receipt.json"
      - name: Report runner disk usage
        if: always() && runner.os != 'Windows'
        run: |
          df -h / || true
          du -sh target 2>/dev/null || true

      # A test process that aborts leaves no message in this log. macOS writes
      # a crash report instead; print it so the cause is visible in the run.
      - name: Show macOS crash reports after a failure
        if: failure() && runner.os == 'macOS'
        run: |
          # The reporter needs a moment to finish writing.
          sleep 20
          reports="${HOME}/Library/Logs/DiagnosticReports"
          ls -l "${reports}" 2>/dev/null || true
          for report in "${reports}"/*.ips "${reports}"/*.crash; do
            [ -f "${report}" ] || continue
            echo "::group::${report##*/}"
            head -c 60000 "${report}"
            echo
            echo "::endgroup::"
          done
          sysctl -n hw.memsize hw.ncpu || true
          vm_stat || true

