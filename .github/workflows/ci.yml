name: CI

on:
  # Every merge updates main and starts a full validation run.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every validation domain without reusing earlier successful results.
        type: boolean
        default: false

# Main pushes and manual runs share one group per branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref_name }}
  # Finish an active main run so later pushes have a validated ancestor. Actions
  # retains only the newest pending main run.
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  CI_DISABLE_REUSE: ${{ inputs.full || 'false' }}
  PINEWASM_ACTIONLINT_VERSION: "1.7.12"
  PINEWASM_CARGO_DENY_VERSION: "0.20.2"
  PINEWASM_GITLEAKS_VERSION: "8.30.1"
  PINEWASM_NODE_VERSION: "24"
  PINEWASM_RUST_VERSION: "1.97.1"
  PINEWASM_WASM_BINDGEN_CLI_VERSION: "0.2.127"
  PINEWASM_TYPESCRIPT_VERSION: "5.9.3"
  PINEWASM_BINARYEN_VERSION: "131"
  CI_HEAD_SHA: ${{ github.sha }}

# Every job uses reviewed GitHub-hosted runner images. Exact repository identity
# and main-branch guards prevent forks or copies from reporting these checks as
# PineWASM's own.
jobs:
  plan:
    name: Select affected validation
    if: ${{ github.repository_id == '1470159731' && github.repository == 'artificial-intelligence-edge/PineWASM' && ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') }}
    runs-on: "ubuntu-24.04"
    # Covers a cold xtask build on a two-core hosted runner; a timeout here
    # skips every downstream job and fails the whole run.
    timeout-minutes: 20
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      rust: ${{ steps.plan.outputs.rust }}
      docs: ${{ steps.plan.outputs.docs }}
      runtime: ${{ steps.plan.outputs.runtime }}
      safety: ${{ steps.plan.outputs.safety }}
      wasm: ${{ steps.plan.outputs.wasm }}
      adversarial: ${{ steps.plan.outputs.adversarial }}
      msrv: ${{ steps.plan.outputs.msrv }}
      full: ${{ steps.plan.outputs.full }}
      range_base: ${{ steps.range.outputs.base }}
    steps:
      - name: Require reviewed GitHub-hosted runner platform
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_RUNNER_OS: Linux
          EXPECTED_RUNNER_ARCH: X64
        run: |
          set -euo pipefail
          [[ "$ACTUAL_RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$RUNNER_OS" == "$EXPECTED_RUNNER_OS" && "$RUNNER_ARCH" == "$EXPECTED_RUNNER_ARCH" ]]
          case "$EXPECTED_RUNNER_OS/$EXPECTED_RUNNER_ARCH" in
            Linux/X64) [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]] ;;
            Linux/ARM64) [[ "$(uname -s)" == Linux && "$(uname -m)" == aarch64 ]] ;;
            macOS/ARM64) [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]] ;;
            *) echo 'Unsupported GitHub-hosted runner platform' >&2; exit 1 ;;
          esac
          printf 'runner.environment=%s\nrunner.os=%s\nrunner.arch=%s\n' "$ACTUAL_RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH"
          python_path="$(type -P python3)"
          [[ "$python_path" == /* && -x "$python_path" ]]
          "$python_path" --version
          "$python_path" -I - <<'PYPREFLIGHT'
          import json, pathlib, sys
          if sys.version_info < (3, 11):
              raise SystemExit("Python 3.11+ is required for the selected CI checks; no fallback")
          import tomllib
          print(json.dumps({"pythonExecutable": str(pathlib.Path(sys.executable).resolve(strict=True)), "pythonVersion": sys.version.split()[0], "tomllibAvailable": True}, sort_keys=True))
          PYPREFLIGHT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: "1000"
          GIT_HTTP_LOW_SPEED_TIME: "60"
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install "${PINEWASM_RUST_VERSION}" --profile minimal
      - name: Record actual stable parent and Cargo child tools
        id: toolchain_stable
        run: |
          tool_pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          python3 .github/ci/toolchain_identity.py --toolchain "$tool_pin" \
            --record "$RUNNER_TEMP/tools-stable.json" --github-path "$GITHUB_PATH" \
            --github-output "$GITHUB_OUTPUT"
      - name: Record exact stable tool identity
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_HEAD_SHA: ${{ github.sha }}
          EXPECTED_TOOL_RECORD_SHA: ${{ steps.toolchain_stable.outputs.record_sha256 }}
        run: python3 .github/ci/emit_owned_record.py --kind toolchain --path "$RUNNER_TEMP/tools-stable.json" --expected-sha "$EXPECTED_TOOL_RECORD_SHA"
      - name: Restore Rust build cache
        id: rust_cache
        # A slow restore must not consume the job budget before any check runs.
        # Bound it and fall back to a cold build instead of failing the run.
        timeout-minutes: 2
        continue-on-error: true
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: "false"
          cache-bin: "false"
          cache-workspace-crates: "true"
          shared-key: repository-policy-v2

      - name: Discard an incomplete Rust cache restore
        if: steps.rust_cache.outcome == 'failure'
        run: cargo clean

      - name: Reject an unavailable Windows job
        if: vars.ENABLE_WINDOWS_CI == 'true'
        run: |
          echo 'Windows CI requested, but no approved Windows validation lane is configured.' >&2
          exit 1

      - name: Plan from the last successful integrated tree
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BASE_SHA: ${{ github.event.before || 'none' }}
          CI_FORCE_FULL: ${{ github.event_name == 'push' || inputs.full || 'false' }}
        run: cargo run --locked -p pinewasm_xtask -- ci-plan --github-output "$GITHUB_OUTPUT"

      # Check every commit since the last successful main run. Failed lookups
      # stop validation rather than silently accepting an empty range.
      - name: Find the commits this run checks
        id: range
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked -p pinewasm_xtask -- ci-range-base --github-output "$GITHUB_OUTPUT"

  guard:
    needs: [plan]
    name: Repository boundary check
    if: ${{ github.repository_id == '1470159731' && github.repository == 'artificial-intelligence-edge/PineWASM' && ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') }}
    runs-on: "ubuntu-24.04"
    # The guard checks the checked-out tree and every immutable PR commit, so
    # runtime scales with the introduced range: a fixed cost for the tree
    # checks plus a per-commit cost for each introduced tree. The budget also
    # covers a cold xtask build on a two-core hosted runner and keeps headroom
    # for long commit ranges rather than reporting a cut run as
    # cancelled.
    timeout-minutes: 45
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Require reviewed GitHub-hosted runner platform
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_RUNNER_OS: Linux
          EXPECTED_RUNNER_ARCH: X64
        run: |
          set -euo pipefail
          [[ "$ACTUAL_RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$RUNNER_OS" == "$EXPECTED_RUNNER_OS" && "$RUNNER_ARCH" == "$EXPECTED_RUNNER_ARCH" ]]
          case "$EXPECTED_RUNNER_OS/$EXPECTED_RUNNER_ARCH" in
            Linux/X64) [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]] ;;
            Linux/ARM64) [[ "$(uname -s)" == Linux && "$(uname -m)" == aarch64 ]] ;;
            macOS/ARM64) [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]] ;;
            *) echo 'Unsupported GitHub-hosted runner platform' >&2; exit 1 ;;
          esac
          printf 'runner.environment=%s\nrunner.os=%s\nrunner.arch=%s\n' "$ACTUAL_RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH"
          python_path="$(type -P python3)"
          [[ "$python_path" == /* && -x "$python_path" ]]
          "$python_path" --version
          "$python_path" -I - <<'PYPREFLIGHT'
          import json, pathlib, sys
          if sys.version_info < (3, 11):
              raise SystemExit("Python 3.11+ is required for the selected CI checks; no fallback")
          import tomllib
          print(json.dumps({"pythonExecutable": str(pathlib.Path(sys.executable).resolve(strict=True)), "pythonVersion": sys.version.split()[0], "tomllibAvailable": True}, sort_keys=True))
          PYPREFLIGHT
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: "1000"
          GIT_HTTP_LOW_SPEED_TIME: "60"
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${PINEWASM_RUST_VERSION}" --profile minimal

      - name: Record actual stable parent and Cargo child tools
        id: toolchain_stable
        run: |
          tool_pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          python3 .github/ci/toolchain_identity.py --toolchain "$tool_pin" \
            --record "$RUNNER_TEMP/tools-stable.json" --github-path "$GITHUB_PATH" \
            --github-output "$GITHUB_OUTPUT"
      - name: Record exact stable tool identity
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_HEAD_SHA: ${{ github.sha }}
          EXPECTED_TOOL_RECORD_SHA: ${{ steps.toolchain_stable.outputs.record_sha256 }}
        run: python3 .github/ci/emit_owned_record.py --kind toolchain --path "$RUNNER_TEMP/tools-stable.json" --expected-sha "$EXPECTED_TOOL_RECORD_SHA"
      - name: Cache repository policy dependencies
        id: rust_cache
        # A slow restore must not consume the job budget before any check runs.
        # Bound it and fall back to a cold build instead of failing the run.
        timeout-minutes: 2
        continue-on-error: true
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: "false"
          # The hosted image owns ~/.cargo/bin (rustup, cargo); never restore over it.
          cache-bin: "false"
          cache-workspace-crates: "true"
          # These jobs compile the same xtask dependencies in fresh runners.
          # Share dependency artifacts; all policy checks still execute.
          shared-key: repository-policy-v2

      - name: Discard an incomplete Rust cache restore
        if: steps.rust_cache.outcome == 'failure'
        run: cargo clean

      - name: Validate changed repository-check machinery
        if: needs.plan.outputs.full == 'true'
        run: cargo run --locked -p pinewasm_xtask -- check-public-boundary --self-test

      - name: Enforce the repository tree and introduced-commit checks
        env:
          # Use the verified baseline, including commits from failed earlier runs.
          BASE_SHA: ${{ needs.plan.outputs.range_base }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          cargo run --locked -p pinewasm_xtask -- check-public-boundary
          if [[ -z "${BASE_SHA}" ]]; then
            echo '::error::No base commit for the range checks; the plan job must resolve it for main runs.'
            exit 1
          fi
          cargo run --locked -p pinewasm_xtask -- check-public-boundary --git-range "${BASE_SHA}" "${HEAD_SHA}"
          # Require one SemVer step per first-parent change.
          cargo run --locked -p pinewasm_xtask -- check-compiler-version --first-parent "${BASE_SHA}" "${HEAD_SHA}"

      - name: Validate coverage claims, documentation links, and the diagnostic registry
        run: cargo run --locked -p pinewasm_xtask -- check-coverage

      # Manifest closure only: this job never measures. A suite that named a
      # job the runner cannot enter would otherwise fail later, during
      # measurement, instead of on the pull request that introduced it.
      - name: Validate the subject-tier benchmark manifest
        run: cargo run --locked -p pinewasm_xtask -- benchmark-subject-check

  workflow-policy:
    needs: [plan]
    name: Workflow policy lint
    if: ${{ github.repository_id == '1470159731' && github.repository == 'artificial-intelligence-edge/PineWASM' && ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') }}
    runs-on: "ubuntu-24.04"
    # A cold policy cache compiles xtask before actionlint; a timeout here
    # skips every downstream job and fails the whole run.
    timeout-minutes: 20
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Require reviewed GitHub-hosted runner platform
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_RUNNER_OS: Linux
          EXPECTED_RUNNER_ARCH: X64
        run: |
          set -euo pipefail
          [[ "$ACTUAL_RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$RUNNER_OS" == "$EXPECTED_RUNNER_OS" && "$RUNNER_ARCH" == "$EXPECTED_RUNNER_ARCH" ]]
          case "$EXPECTED_RUNNER_OS/$EXPECTED_RUNNER_ARCH" in
            Linux/X64) [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]] ;;
            Linux/ARM64) [[ "$(uname -s)" == Linux && "$(uname -m)" == aarch64 ]] ;;
            macOS/ARM64) [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]] ;;
            *) echo 'Unsupported GitHub-hosted runner platform' >&2; exit 1 ;;
          esac
          printf 'runner.environment=%s\nrunner.os=%s\nrunner.arch=%s\n' "$ACTUAL_RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH"
          python_path="$(type -P python3)"
          [[ "$python_path" == /* && -x "$python_path" ]]
          "$python_path" --version
          "$python_path" -I - <<'PYPREFLIGHT'
          import json, pathlib, sys
          if sys.version_info < (3, 11):
              raise SystemExit("Python 3.11+ is required for the selected CI checks; no fallback")
          import tomllib
          print(json.dumps({"pythonExecutable": str(pathlib.Path(sys.executable).resolve(strict=True)), "pythonVersion": sys.version.split()[0], "tomllibAvailable": True}, sort_keys=True))
          PYPREFLIGHT
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: "1000"
          GIT_HTTP_LOW_SPEED_TIME: "60"
        with:
          persist-credentials: false

      - name: Verify policy preflight and native cache recovery checks
        run: python3 -B -m unittest discover -s .github/ci -p 'test_*.py'

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${PINEWASM_RUST_VERSION}" --profile minimal

      - name: Record actual stable parent and Cargo child tools
        id: toolchain_stable
        run: |
          tool_pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          python3 .github/ci/toolchain_identity.py --toolchain "$tool_pin" \
            --record "$RUNNER_TEMP/tools-stable.json" --github-path "$GITHUB_PATH" \
            --github-output "$GITHUB_OUTPUT"
      - name: Record exact stable tool identity
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_HEAD_SHA: ${{ github.sha }}
          EXPECTED_TOOL_RECORD_SHA: ${{ steps.toolchain_stable.outputs.record_sha256 }}
        run: python3 .github/ci/emit_owned_record.py --kind toolchain --path "$RUNNER_TEMP/tools-stable.json" --expected-sha "$EXPECTED_TOOL_RECORD_SHA"
      - name: Cache repository policy dependencies
        id: rust_cache
        # A slow restore must not consume the job budget before any check runs.
        # Bound it and fall back to a cold build instead of failing the run.
        timeout-minutes: 2
        continue-on-error: true
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: "false"
          # The hosted image owns ~/.cargo/bin (rustup, cargo); never restore over it.
          cache-bin: "false"
          cache-workspace-crates: "true"
          # These jobs compile the same xtask dependencies in fresh runners.
          # Share dependency artifacts; all policy checks still execute.
          shared-key: repository-policy-v2

      - name: Discard an incomplete Rust cache restore
        if: steps.rust_cache.outcome == 'failure'
        run: cargo clean

      - name: Install checksum-verified actionlint
        run: |
          actionlint_root="${RUNNER_TEMP}/actionlint/${PINEWASM_ACTIONLINT_VERSION}"
          cargo run --locked -p pinewasm_xtask -- install-actionlint \
            "${PINEWASM_ACTIONLINT_VERSION}" "${actionlint_root}"
          echo "${actionlint_root}/bin" >> "${GITHUB_PATH}"

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Require immutable action pins and complete MSRV fixtures
        run: cargo run --locked -p pinewasm_xtask -- check-workflow-pins

  secret-scan:
    needs: [plan]
    name: Repository tree and introduced-commit secret scan
    if: ${{ github.repository_id == '1470159731' && github.repository == 'artificial-intelligence-edge/PineWASM' && ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') }}
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Require reviewed GitHub-hosted runner platform
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_RUNNER_OS: Linux
          EXPECTED_RUNNER_ARCH: X64
        run: |
          set -euo pipefail
          [[ "$ACTUAL_RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$RUNNER_OS" == "$EXPECTED_RUNNER_OS" && "$RUNNER_ARCH" == "$EXPECTED_RUNNER_ARCH" ]]
          case "$EXPECTED_RUNNER_OS/$EXPECTED_RUNNER_ARCH" in
            Linux/X64) [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]] ;;
            Linux/ARM64) [[ "$(uname -s)" == Linux && "$(uname -m)" == aarch64 ]] ;;
            macOS/ARM64) [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]] ;;
            *) echo 'Unsupported GitHub-hosted runner platform' >&2; exit 1 ;;
          esac
          printf 'runner.environment=%s\nrunner.os=%s\nrunner.arch=%s\n' "$ACTUAL_RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH"
          python_path="$(type -P python3)"
          [[ "$python_path" == /* && -x "$python_path" ]]
          "$python_path" --version
          "$python_path" -I - <<'PYPREFLIGHT'
          import json, pathlib, sys
          if sys.version_info < (3, 11):
              raise SystemExit("Python 3.11+ is required for the selected CI checks; no fallback")
          import tomllib
          print(json.dumps({"pythonExecutable": str(pathlib.Path(sys.executable).resolve(strict=True)), "pythonVersion": sys.version.split()[0], "tomllibAvailable": True}, sort_keys=True))
          PYPREFLIGHT
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: "1000"
          GIT_HTTP_LOW_SPEED_TIME: "60"
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${PINEWASM_RUST_VERSION}" --profile minimal

      - name: Record actual stable parent and Cargo child tools
        id: toolchain_stable
        run: |
          tool_pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          python3 .github/ci/toolchain_identity.py --toolchain "$tool_pin" \
            --record "$RUNNER_TEMP/tools-stable.json" --github-path "$GITHUB_PATH" \
            --github-output "$GITHUB_OUTPUT"
      - name: Record exact stable tool identity
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_HEAD_SHA: ${{ github.sha }}
          EXPECTED_TOOL_RECORD_SHA: ${{ steps.toolchain_stable.outputs.record_sha256 }}
        run: python3 .github/ci/emit_owned_record.py --kind toolchain --path "$RUNNER_TEMP/tools-stable.json" --expected-sha "$EXPECTED_TOOL_RECORD_SHA"
      - name: Cache repository policy dependencies
        id: rust_cache
        # A slow restore must not consume the job budget before any check runs.
        # Bound it and fall back to a cold build instead of failing the run.
        timeout-minutes: 2
        continue-on-error: true
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: "false"
          # The hosted image owns ~/.cargo/bin (rustup, cargo); never restore over it.
          cache-bin: "false"
          cache-workspace-crates: "true"
          # These jobs compile the same xtask dependencies in fresh runners.
          # Share dependency artifacts; all policy checks still execute.
          shared-key: repository-policy-v2

      - name: Discard an incomplete Rust cache restore
        if: steps.rust_cache.outcome == 'failure'
        run: cargo clean

      - name: Restore checksum-verified Gitleaks
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/gitleaks/${{ env.PINEWASM_GITLEAKS_VERSION }}
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ env.PINEWASM_GITLEAKS_VERSION }}

      - name: Install checksum-verified Gitleaks
        run: |
          gitleaks_root="${RUNNER_TOOL_CACHE}/gitleaks/${PINEWASM_GITLEAKS_VERSION}"
          cargo run --locked -p pinewasm_xtask -- install-gitleaks \
            "${PINEWASM_GITLEAKS_VERSION}" "${gitleaks_root}"
          echo "${gitleaks_root}/bin" >> "${GITHUB_PATH}"

      - name: Validate changed check-secrets machinery
        if: needs.plan.outputs.full == 'true'
        run: cargo run --locked -p pinewasm_xtask -- check-secrets --self-test

      - name: Scan the repository tree and every introduced commit
        env:
          # Use the verified baseline, including commits from failed earlier runs.
          BASE_SHA: ${{ needs.plan.outputs.range_base }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          cargo run --locked -p pinewasm_xtask -- check-secrets
          if [[ -z "${BASE_SHA}" ]]; then
            echo '::error::No base commit for the range checks; the plan job must resolve it for main runs.'
            exit 1
          fi
          cargo run --locked -p pinewasm_xtask -- check-secrets --git-range "${BASE_SHA}" "${HEAD_SHA}"

  dco:
    needs: [plan]
    name: Developer Certificate of Origin sign-off
    if: ${{ github.repository_id == '1470159731' && github.repository == 'artificial-intelligence-edge/PineWASM' && ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') }}
    runs-on: "ubuntu-24.04"
    # The check itself takes seconds; the budget is a cold xtask build.
    timeout-minutes: 20
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Require reviewed GitHub-hosted runner platform
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_RUNNER_OS: Linux
          EXPECTED_RUNNER_ARCH: X64
        run: |
          set -euo pipefail
          [[ "$ACTUAL_RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$RUNNER_OS" == "$EXPECTED_RUNNER_OS" && "$RUNNER_ARCH" == "$EXPECTED_RUNNER_ARCH" ]]
          case "$EXPECTED_RUNNER_OS/$EXPECTED_RUNNER_ARCH" in
            Linux/X64) [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]] ;;
            Linux/ARM64) [[ "$(uname -s)" == Linux && "$(uname -m)" == aarch64 ]] ;;
            macOS/ARM64) [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]] ;;
            *) echo 'Unsupported GitHub-hosted runner platform' >&2; exit 1 ;;
          esac
          printf 'runner.environment=%s\nrunner.os=%s\nrunner.arch=%s\n' "$ACTUAL_RUNNER_ENVIRONMENT" "$RUNNER_OS" "$RUNNER_ARCH"
          python_path="$(type -P python3)"
          [[ "$python_path" == /* && -x "$python_path" ]]
          "$python_path" --version
          "$python_path" -I - <<'PYPREFLIGHT'
          import json, pathlib, sys
