name: Contributor policy

# Native events use the trusted base; manual dispatch uses the selected
# ref. Neither path checks out candidate files or runs repository scripts.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to check.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  contributor-policy:
    name: Contributor acceptance policy
    if: ${{ github.repository_id == '1470159731' && github.repository == 'artificial-intelligence-edge/PineWASM' && (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch' && github.actor == 'jdehorty' && github.triggering_actor == 'jdehorty' && github.ref == 'refs/heads/contributor-policy') }}
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    steps:
      - name: Verify fixed policy execution context
        shell: bash
        env:
          POLICY_RUNNER_OS: ${{ runner.os }}
          POLICY_RUNNER_ARCH: ${{ runner.arch }}
          POLICY_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          [[ "${POLICY_RUNNER_OS}" == Linux && "${POLICY_RUNNER_ARCH}" == X64 && "${POLICY_RUNNER_ENVIRONMENT}" == github-hosted ]]
          [[ "${GITHUB_REPOSITORY}" == artificial-intelligence-edge/PineWASM && "${GITHUB_REPOSITORY_ID}" == 1470159731 ]]
          [[ "${GITHUB_API_URL}" == https://api.github.com && "${GITHUB_SERVER_URL}" == https://github.com ]]
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            [[ "${GITHUB_ACTOR}" == jdehorty && "${GITHUB_TRIGGERING_ACTOR}" == jdehorty && "${GITHUB_REF}" == refs/heads/contributor-policy ]]
          else
            [[ "${GITHUB_EVENT_NAME}" == pull_request_target ]]
          fi
      # No checkout, actions, caches, artifacts, or repository code. Outside
      # pull requests are not accepted yet.
      - name: Enforce pending outside-contribution policy
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          BASE_REPOSITORY_ID: ${{ github.event.repository.id }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_PR_NUMBER: ${{ inputs.pull_request_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail_policy() { echo "::error::Contributor policy metadata or execution context is invalid" >&2; exit 1; }
          [[ -n "${GH_TOKEN:-}" ]] || fail_policy
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            [[ "${GITHUB_ACTOR}" == jdehorty && "${GITHUB_TRIGGERING_ACTOR}" == jdehorty && "${GITHUB_REF}" == refs/heads/contributor-policy ]] || fail_policy
            [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ && "${DISPATCH_PR_NUMBER}" =~ ^[1-9][0-9]*$ && "${#DISPATCH_PR_NUMBER}" -le 10 ]] || fail_policy
            fetch_current_pr() {
              curl --fail --silent --show-error \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${DISPATCH_PR_NUMBER}"
            }
            valid_current_pr() {
              jq -e --arg repository "${GITHUB_REPOSITORY}" --arg sha "${GITHUB_SHA}" \
                --argjson number "${DISPATCH_PR_NUMBER}" '
                type == "object" and .number == $number and .state == "open" and
                .user.login == "jdehorty" and
                .head.repo.id == 1470159731 and .head.repo.full_name == $repository and
                .base.repo.id == 1470159731 and .base.repo.full_name == $repository and
                .base.ref == "main" and .head.ref == "contributor-policy" and
                .head.sha == $sha' >/dev/null 2>&1
            }
            pr_metadata=$(fetch_current_pr) || fail_policy
            printf '%s' "${pr_metadata}" | valid_current_pr || fail_policy
            PR_AUTHOR=$(printf '%s' "${pr_metadata}" | jq -r '.user.login')
            PR_HEAD_REPOSITORY_ID=$(printf '%s' "${pr_metadata}" | jq -r '.head.repo.id')
            BASE_REPOSITORY_ID=$(printf '%s' "${pr_metadata}" | jq -r '.base.repo.id')
            CANDIDATE_SHA=$(printf '%s' "${pr_metadata}" | jq -r '.head.sha')
          elif [[ "${GITHUB_EVENT_NAME}" != pull_request_target ]]; then
            fail_policy
          fi
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ && "${BASE_REPOSITORY_ID}" == 1470159731 ]] || fail_policy
          acceptance_state=success
          acceptance_description="Maintainer contribution accepted."
          if [[ "${PR_AUTHOR}" != "jdehorty" || "${PR_HEAD_REPOSITORY_ID}" != "${BASE_REPOSITORY_ID}" ]]; then
            acceptance_state=failure
            acceptance_description="Outside contributions are not accepted by this check."
          fi
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            # Recheck immediately before the status write. A later head change
            # cannot inherit a status addressed to this exact SHA.
            pr_metadata=$(fetch_current_pr) || fail_policy
            printf '%s' "${pr_metadata}" | valid_current_pr || fail_policy
          fi
          # pull_request_target runs on the base SHA. Publish the result on the
          # exact candidate SHA so required-status evaluation uses this decision.
          acceptance_payload=$(jq -n \
            --arg state "${acceptance_state}" \
            --arg description "${acceptance_description}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, description: $description, context: "Contributor acceptance policy", target_url: $target_url}')
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "${acceptance_payload}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" > /dev/null
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            pr_metadata=$(fetch_current_pr) || fail_policy
            printf '%s' "${pr_metadata}" | valid_current_pr || fail_policy
          fi
          [[ "${acceptance_state}" == success ]]
